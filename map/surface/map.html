<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAP — ontologies × concepts</title>
  <style>
    :root {
      --void: #04060c; --ink: #d7e3ef; --dim: #5d6b7d;
      --hair: rgba(160, 190, 220, 0.14);
      --ember: #ff5a3c; --gold: #ffc94d; --cyan: #59f2ff; --violet: #b06bff;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--void); color: var(--ink); font-family: var(--mono); }
    header { padding: 16px 20px 0; }
    header .t { font-size: 20px; }
    header .s { font-size: 11px; color: var(--dim); margin-top: 2px; }
    #bar { display: flex; gap: 12px; align-items: center; padding: 12px 20px; font-size: 11px; color: var(--dim); position: sticky; top: 0; background: var(--void); z-index: 5; border-bottom: 1px solid var(--hair); }
    #scrub { flex: 1; }
    main { display: grid; grid-template-columns: 340px 1fr; gap: 0; align-items: start; }
    #ontcol { border-right: 1px solid var(--hair); padding: 12px; }
    #concol { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; align-content: start; }
    .colhead { font-size: 11px; letter-spacing: .14em; color: var(--dim); margin-bottom: 10px; }
    .card { border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: rgba(10, 16, 28, .5); }
    .card:hover { border-color: var(--cyan); }
    .card.active { border-color: var(--cyan); }
    .card .id { font-size: 12px; word-break: break-all; }
    .card .belief { font-size: 12px; line-height: 1.5; margin: 6px 0; }
    .card .meta { font-size: 11px; color: var(--dim); margin-top: 6px; }
    .badge { display: inline-block; font-size: 10px; border: 1px solid var(--hair); border-radius: 99px; padding: 1px 8px; margin-right: 4px; }
    .b-evolved { color: var(--cyan); border-color: var(--cyan); }
    .b-scarred { color: var(--ember); border-color: var(--ember); }
    .b-blank { color: var(--violet); border-color: var(--violet); }
    .b-seeded { color: var(--dim); }
    .card.blanklane { border-style: dashed; }
    #detail { border-top: 1px solid var(--hair); margin-top: 12px; padding: 12px 20px 40px; font-size: 12px; }
    #detail .ev { border-top: 1px solid var(--hair); padding: 6px 0; font-size: 11px; }
    #detail .t { color: var(--dim); }
    #detail .scar { color: var(--ember); }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } #ontcol { border-right: none; border-bottom: 1px solid var(--hair); } }
  </style>
</head>
<body>
  <header><div class="t">Map</div><div class="s" id="sub">ontologies × concepts</div></header>
  <div id="bar"><span id="cursor">head</span><input id="scrub" type="range" min="0" max="1000" value="1000" /><span id="counts"></span></div>
  <main>
    <section id="ontcol"><div class="colhead">ONTOLOGIES</div><div id="onts"></div></section>
    <section><div class="colhead" style="padding:12px 12px 0">CONCEPTS · newest first</div><div id="concol"></div></section>
  </main>
  <section id="detail"></section>
  <script type="module" src="/map.js"></script>
</body>
</html>
